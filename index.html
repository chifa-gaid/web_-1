<html>
<head>
    <title>My Card</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            width: 350px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .info {
            margin: 10px 0;
            font-size: 16px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }

        .info:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>✨ Welcome To My Web Site ✨</h1>
        <div class="info">Full name: Chifa Gaid</div>
        <div class="info">Age: 20 years old</div>
        <div class="info">Class: 2nd LMD Computer Science</div>
        <div class="info">University: University of El Oued</div>
    </div>

</body>
</html>
